spring.application.name=partner-simulator
server.port=8081

# Spec 08: expose health + the Prometheus scrape endpoint so Prometheus collects the simulator's
# http.server.requests timings — the partner-leg latency the dashboard renders.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=partner-simulator
management.metrics.distribution.percentiles-histogram.http.server.requests=true
