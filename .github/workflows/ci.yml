name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build and verify (compile + tests + quality gates)
        # No -q: keep the reactor summary and the property-stub "Skipped: 1" line
        # visible in CI logs, so the wired-but-inert zero-drift gate is provable.
        run: ./mvnw -B verify
