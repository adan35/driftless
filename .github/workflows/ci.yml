name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Least-privilege by default; jobs widen only what they need.
permissions:
  contents: read

jobs:
  build:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build and verify (compile + tests + quality gates)
        # No -q: keep the reactor summary and the property gate's executed-test line
        # visible in CI logs, so the zero-drift gate and the ArchUnit module-boundary
        # rules are provably running, not skipped. `verify` also runs maven-enforcer
        # (build contract) and emits the CycloneDX SBOM via cyclonedx-maven-plugin.
        run: ./mvnw -B verify

      - name: Upload CycloneDX SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: |
            target/bom.json
            target/bom.xml
          if-no-files-found: error

  image-scan:
    name: image-scan (trivy)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            dockerfile: app/Dockerfile
            image: driftless-app:ci
          - name: partner-simulator
            dockerfile: partner-simulator/Dockerfile
            image: driftless-partner-simulator:ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ${{ matrix.name }} image
        # Build context is the repository root (multi-stage Dockerfiles build the reactor slice).
        run: docker build -f ${{ matrix.dockerfile }} -t ${{ matrix.image }} .

      - name: Scan ${{ matrix.name }} image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # Report-only: surface findings in the Security tab without making the build
          # perpetually red on transitive base-image CVEs that have no fix yet.
          exit-code: "0"

      - name: Upload Trivy SARIF for ${{ matrix.name }}
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
