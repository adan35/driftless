# Integration-test configuration for the recon module.
# Allow @DynamicPropertySource / @TestConfiguration to override beans (e.g. the Clock, datasource).
spring.main.allow-bean-definition-overriding=true
# Flyway owns the schema; Hibernate must never alter it — validate only, against the migrated DB.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.flywaydb=info
# Drive the outbox relay deterministically: a long poll delay means the scheduled sweep effectively
# never fires during a test.
driftless.outbox.relay.poll-delay-millis=3600000
driftless.outbox.relay.batch-size=100
driftless.outbox.relay.max-batches-per-sweep=50
# Drive the scheduled reconciliation job and the auth recovery sweep directly in tests, never on a
# wall-clock cadence.
driftless.recon.schedule-interval=PT1H
auth.recovery.poll-delay=PT1H
