# jqwik configuration (since 1.6 jqwik reads junit-platform.properties).
# Keep jqwik's failure-replay database under target/ so the existing `target/` .gitignore rule
# covers it and it never lands in source control.
jqwik.database = target/.jqwik-database
# Reproducibility relies on jqwik reporting the failing `@ForAll seed` of a failed try, which can then
# be replayed via that seed — not on a global fixed seed (jqwik has no such standard key; seeds are
# fixed per `@Property(seed = ...)`). The gate keeps fully randomized tries by design.
