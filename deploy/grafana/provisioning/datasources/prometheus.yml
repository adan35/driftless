# Grafana datasource provisioning (Spec 08) — auto-loaded at startup, no manual clicking.
# Points at the Prometheus service Spec 09's compose stands up at http://prometheus:9090.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: driftless-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 10s
      httpMethod: POST
