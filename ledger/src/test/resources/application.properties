# Integration-test configuration for the ledger module.
# Allow a @TestConfiguration to override the common ClockConfig#clock bean with a fixed Clock
# (the documented test-time override path; production keeps the single ClockConfig bean).
spring.main.allow-bean-definition-overriding=true
# Flyway owns the schema; Hibernate must never alter it — validate only, against the migrated DB.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.open-in-view=false
# Surface SQL only when a test fails locally; quiet by default to keep the build log readable.
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.flywaydb=info
