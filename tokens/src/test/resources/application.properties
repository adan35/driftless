# Integration-test configuration for the tokens module.
# Allow a @TestConfiguration to override the common ClockConfig#clock bean with a fixed Clock,
# and to supply a test EventPublisher in place of the default LoggingEventPublisher.
spring.main.allow-bean-definition-overriding=true
# Flyway owns the schema; Hibernate must never alter it — validate only, against the migrated DB.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.flywaydb=info
# Drive the relay deterministically from tests rather than on a wall-clock cadence: a long poll delay
# means the scheduled sweep effectively never fires during a test, and tests invoke the relay directly.
driftless.outbox.relay.poll-delay-millis=3600000
driftless.outbox.relay.batch-size=100
driftless.outbox.relay.max-batches-per-sweep=50
