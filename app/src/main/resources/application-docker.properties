# Spec 09 — `docker` profile: configuration for the composed local stack (docker-compose.yml).
# Activated with SPRING_PROFILES_ACTIVE=docker. The datasource is supplied via environment variables
# from compose; everything that is fixed by the compose topology lives here.

# --- partner-simulator: a REAL network hop to the separate container, by service name ---------------
# Single source of truth for the partner topology is the deploy descriptor (docker-compose.yml /
# k8s/30-app.yaml) via the AUTH_PARTNER_BASE_URL and DRIFTLESS_RECON_PARTNER_CONTROL_BASE_URL env
# vars — both the bounded-timeout partner leg and the recon fault-injection control plane read it from
# there, so the URL is visible in the deployment manifest and never duplicated here.

# --- demo rule set: a blocking MCC so the demo's decline mix produces real declines ----------------
driftless.rules.mcc[0].rule-id=block-gambling
driftless.rules.mcc[0].priority=1
driftless.rules.mcc[0].mode=BLOCK
driftless.rules.mcc[0].codes[0]=7995

# --- quick crash-recovery cadence so injected partner timeouts settle to REVERSED within the demo ---
auth.recovery.stuck-after=PT2S
auth.recovery.partner-grace=PT1S
auth.recovery.poll-delay=PT3S

# --- continuous reconciliation cadence: re-prove zero drift every 15s for the dashboard ------------
driftless.recon.schedule-interval=PT15S

# --- seed-only demo endpoint (POST /demo/run) enabled for the local stack -------------------------
driftless.demo.enabled=true
