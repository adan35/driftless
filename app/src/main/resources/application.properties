spring.application.name=driftless

# Flyway owns the schema (all module timelines are composed by MultiModuleFlywayConfig); Hibernate
# must never alter it and only validates its mappings against the migrated tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# --- Actuator / Prometheus (Spec 08) ---------------------------------------------------------------
# Expose health (+ liveness/readiness probes) and the Prometheus scrape endpoint; everything else
# stays off the web surface.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
# Tag every metric with the application so a multi-target Prometheus can group by service.
management.metrics.tags.application=driftless
# Percentile histograms for HTTP server timings so dashboards can render p95/p99 latencies.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
