---
# The modular monolith. Flyway migrates every module's schema on startup; the partner leg and the
# recon fault-injection control plane both reach the partner-simulator by service name.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: driftless
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: driftless/app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/driftless
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_PASSWORD
            - name: AUTH_PARTNER_BASE_URL
              value: http://partner-simulator:8081
            - name: DRIFTLESS_RECON_PARTNER_CONTROL_BASE_URL
              value: http://partner-simulator:8081
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: driftless
  labels:
    app: app
spec:
  selector:
    app: app
  ports:
    - name: http
      port: 8080
      targetPort: 8080
