---
# Stretch goal: a single-replica Postgres for local clusters (kind/minikube). For anything beyond a
# demo, use a managed Postgres and point SPRING_DATASOURCE_URL at it instead of this Deployment.
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  namespace: driftless
type: Opaque
stringData:
  POSTGRES_DB: driftless
  POSTGRES_USER: driftless
  POSTGRES_PASSWORD: driftless
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: driftless
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: driftless
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: postgres
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "driftless", "-d", "driftless"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "driftless", "-d", "driftless"]
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: driftless
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
